[package]
name = "clipsta-capture"
version = "2.3.2"
description = "Clipsta capture engine — WGC + WASAPI + Hardware Encode + Replay Buffer (Standalone tray app)"
authors = ["Clipsta"]
edition = "2021"

[lib]
name = "clipsta_capture"
path = "src/lib.rs"

[[bin]]
name = "clipsta-capture"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0"
parking_lot = "0.12"
memmap2 = "0.9"
dirs = "6"
chrono = "0.4"
windows-core = "0.62"

[dependencies.windows]
version = "0.62"
features = [
  # Foundation
  "Foundation",
  "Foundation_Collections",
  # WGC
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Security_Authorization_AppCapabilityAccess",
  # D3D11 / DXGI
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  # Media Foundation
  "Win32_Media_MediaFoundation",
  "Win32_Media_Audio",
  # System / COM
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_System_Performance",
  "Win32_System_Pipes",
  "Win32_System_IO",
  "Win32_System_Console",
  "Win32_System_LibraryLoader",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  # UI — window enumeration + shell tray + menus
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse",
  # Properties / Security / Storage
  "Win32_Devices_Properties",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Security",
  "Win32_Storage_FileSystem",
]
