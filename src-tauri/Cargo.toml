[package]
name = "clipsta-tauri"
version = "2.3.3"
description = "Clipsta - Gaming clip recorder powered by Windows Capture"
authors = ["Clipsta"]
edition = "2021"
default-run = "clipsta-tauri"

[lib]
name = "clipsta_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [ "tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "multipart"] }
anyhow = "1.0"
chrono = "0.4"
parking_lot = "0.12"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
memmap2 = "0.9"
windows-core = "0.62"
clipsta-capture = { path = "../clipsta-capture" }

[dependencies.windows]
version = "0.62"
features = [
  # Foundation (minimal)
  "Win32_Foundation",
  # Media Foundation (lossless_trim, mp4_inspect, daemon)
  "Win32_Media_MediaFoundation",
  # System / COM (lossless_trim, mp4_inspect, daemon)
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  # UI (commands, daemon, lib hotkey handling)
  "Win32_UI_WindowsAndMessaging",
  # Threading (single instance mutex)
  "Win32_System_Threading",
]

[[bin]]
name = "clipsta-daemon"
path = "src/bin/clipsta-daemon.rs"
